[package]
name = "live-subs"
version = "0.1.0"
edition = "2021"
description = "Local live subtitles: system audio -> VAD -> whisper.cpp -> tiny llama.cpp cleanup"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cpal = "0.15"
hound = "3.5"
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Overlay is optional. Enable with `--features overlay` once you want a window.
# eframe pulls wgpu; skip it until the pipeline is proven in the terminal.
eframe = { version = "0.31", optional = true }
rfd = { version = "0.15", optional = true }
tray-icon = { version = "0.21", default-features = false, optional = true }
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
sha2 = "0.10"
tokio-util = { version = "0.7", default-features = false }
ort = { version = "2.0.0-rc.13", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
whisper-rs = { version = "0.16", optional = true }
llama-cpp-2 = { version = "=0.1.159", optional = true, default-features = false }
sysinfo = "0.39.6"

[features]
default = []
overlay = ["dep:eframe", "dep:tray-icon", "dep:rfd"]
silero = ["dep:ort"]
whisper-rs = ["dep:whisper-rs"]
# Compiles llama.cpp in. Metal is added on macOS below. Not part of the default CI job.
llama = ["dep:llama-cpp-2"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
criterion = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.159", optional = true, default-features = false, features = ["metal"] }

[[bench]]
name = "partial"
harness = false
