[package]
name = "live-subs"
version = "0.1.0"
edition = "2021"
description = "Local live subtitles: system audio -> VAD -> whisper.cpp -> tiny llama.cpp cleanup"
license = "MIT"

[dependencies]
anyhow = "1"
async-trait = "0.1"
cpal = "0.15"
hound = "3.5"
ringbuf = "0.4"
rubato = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Overlay is optional. Enable with `--features overlay` once you want a window.
# eframe pulls wgpu; skip it until the pipeline is proven in the terminal.
eframe = { version = "0.31", optional = true }

[features]
default = []
overlay = ["dep:eframe"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
