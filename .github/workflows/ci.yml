name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries
        # cpal links ALSA on Linux.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        # whisper-rs compiles whisper.cpp and is not part of this job (spec 09).
        run: cargo clippy --all-targets --features overlay,silero -- -D warnings
      - name: Test
        run: cargo test --all-targets --features overlay,silero
