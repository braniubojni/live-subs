name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System libraries
        # cpal links ALSA. `--features overlay` links GTK (tray menu via muda)
        # plus the X11, Wayland, and Vulkan headers eframe looks up with pkg-config.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            pkg-config \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libvulkan-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        # whisper-rs compiles whisper.cpp and is not part of this job (spec 09).
        run: cargo clippy --all-targets --features overlay,silero -- -D warnings
      - name: Test
        run: cargo test --all-targets --features overlay,silero

  overlay-macos:
    name: build overlay (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --features overlay
